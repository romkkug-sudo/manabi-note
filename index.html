<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>まなびノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFF9EC; --line:#EBDDBF; --line2:#E2CFA8;
  --ink:#3A3530; --sub:#7A6E60; --muted:#A99D8C;
  --red:#D8352A; --blue:#2B6CB0; --green:#2F8F6B; --greenbg:#E3F3EA;
  --cover:#F2E2C2; --cover2:#E7D1A6; --card:#FFFDF7;
  --cell:40px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#EFE6D4;color:var(--ink);font-family:"Zen Maru Gothic",system-ui,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;touch-action:manipulation}
.screen{display:none;height:100dvh;min-height:100vh}
.screen.show{display:flex}
.hand{font-family:"Klee One","Zen Maru Gothic",serif}

/* ---- cover ---- */
#cover{align-items:center;justify-content:center;padding:24px}
.notebook{position:relative;width:min(560px,100%);background:var(--cover);border-radius:10px 18px 18px 10px;padding:40px 40px 36px 72px;border:1px solid var(--cover2)}
.notebook::before{content:"";position:absolute;left:0;top:0;bottom:0;width:36px;background:#C9A76B;border-radius:10px 0 0 10px}
.notebook .label{background:var(--card);border:1.5px solid #C9A76B;border-radius:10px;padding:18px 22px;margin-bottom:26px}
.notebook h1{margin:0;font-family:"Klee One",serif;font-size:44px;font-weight:600;letter-spacing:4px}
.notebook .sub{margin:6px 0 0;color:var(--sub);font-size:15px}
.notebook p.ask{margin:0 0 12px;font-size:18px;font-weight:700}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grade{background:var(--card);border:1.5px solid var(--cover2);border-radius:12px;padding:14px 6px;font-size:22px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.grade small{font-size:11px;font-weight:500;color:var(--muted)}
.grade.ready{border-color:var(--green);color:var(--green)}
.grade.ready small{color:var(--green)}
.grade[disabled]{opacity:.55;cursor:default}

/* ---- toc ---- */
#toc{justify-content:center;padding:24px;overflow:auto}
.page{width:min(720px,100%);background:var(--paper);border-radius:14px;border:1px solid var(--line2);padding:28px 36px;background-image:linear-gradient(transparent 47px,var(--line) 48px);background-size:100% 48px;align-self:flex-start}
.pagehead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.pagehead h2{margin:0;font-family:"Klee One",serif;font-size:30px;font-weight:600}
.chip{background:var(--card);border:1px solid var(--line2);border-radius:99px;padding:4px 12px;font-size:14px;color:var(--sub)}
.back{display:inline-flex;align-items:center;gap:4px;padding:8px 12px;border-radius:10px;font-size:16px;color:var(--sub)}
.back:active{background:rgba(0,0,0,.05)}
.subject{margin:18px 0 4px;font-size:15px;font-weight:700;color:var(--sub);display:flex;align-items:center;gap:8px}
.subject .dot{width:10px;height:10px;border-radius:50%}
.unit{width:100%;display:flex;align-items:center;gap:10px;height:48px;font-family:"Klee One",serif;font-size:21px;text-align:left;padding:0 6px}
.unit .lead{flex:1;border-bottom:2px dotted var(--muted);transform:translateY(-6px)}
.unit .no{font-size:15px;color:var(--sub);font-family:"Zen Maru Gothic"}
.unit:active{background:rgba(216,53,42,.06)}
.unit.soon{color:var(--muted);cursor:default}
.unit .done{color:var(--red);font-size:15px;font-family:"Zen Maru Gothic";font-weight:700}

/* ---- work ---- */
#work{flex-direction:column}
.bar{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--card);border-bottom:1px solid var(--line2)}
.bar .title{font-family:"Klee One",serif;font-size:20px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line2);display:block}
.dots i.ok{background:var(--red);border-color:var(--red)}
.dots i.ng{background:var(--muted);border-color:var(--muted)}
.dots i.now{border-color:var(--ink)}
.main{flex:1;display:flex;min-height:0}
.paper{position:relative;flex:1;min-width:0;background-color:var(--paper);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:var(--cell) var(--cell);overflow:hidden}
#fig{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.qtext{position:absolute;left:12px;top:10px;right:12px;font-family:"Klee One",serif;font-size:21px;line-height:1.45;pointer-events:none}
.qtext .hint{display:block;font-size:14px;color:var(--sub);font-family:"Zen Maru Gothic"}
.tools{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:4px;background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:6px}
.tool{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.tool svg{width:26px;height:26px}
.tool.on{background:#EFE3CB}
.tool .sw{width:20px;height:20px;border-radius:50%}
.sep{width:1px;background:var(--line2);margin:6px 2px}

.pad{width:290px;flex:none;background:var(--card);border-left:1px solid var(--line2);padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.pad>*{flex:none}
.pad h3{margin:0;font-size:15px;color:var(--sub);font-weight:700}
.answer{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:"Klee One",serif;font-size:20px}
.field{min-width:84px;height:56px;border:2px solid var(--line2);border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:flex-end;padding:0 12px;font-size:30px;font-family:"Klee One",serif}
.field.small{min-width:64px}
.field.on{border-color:var(--blue);box-shadow:0 0 0 3px rgba(43,108,176,.15)}
.field:empty::before{content:"　"}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{height:54px;border-radius:12px;background:#F6EEDD;font-size:26px;font-family:"Klee One",serif}
.key:active{background:#EADCC0}
.key.fn{font-size:15px;font-family:"Zen Maru Gothic";color:var(--sub)}
.check{height:56px;border-radius:14px;background:var(--green);color:#fff;font-size:20px;font-weight:700}
.check:active{filter:brightness(.92)}
.msg{min-height:24px;font-size:16px;line-height:1.5}
.msg.ng{color:var(--red)}
.msg button{margin-top:8px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line2);font-size:15px;background:#fff}
.hintbtn{height:46px;border-radius:14px;border:2px dashed #E0B44C;background:#FFF6DC;color:#8A5A00;font-size:17px;font-weight:700}
.hintbtn.done{border-style:solid;border-color:var(--line2);background:#fff;color:var(--muted)}
.hintbtn.nudge{animation:nudge .5s ease-in-out 2}
@keyframes nudge{50%{transform:scale(1.05)}}
.hintcard{background:#FFF6DC;border-radius:12px;padding:10px 12px;font-size:16px;line-height:1.6;color:#6B4700;margin-bottom:8px;font-family:"Klee One",serif}
.hintcard b{font-family:"Zen Maru Gothic";font-size:13px;color:#A8740A;display:block}
.steps{background:var(--greenbg);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.7;color:#22684D}
.steps b{font-weight:700}

/* hanamaru overlay */
#maru{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,249,236,.55);z-index:5}
#maru.show{display:flex}
.maru-card{display:flex;flex-direction:column;align-items:center;gap:6px;background:rgba(255,253,247,.96);border:1px solid var(--line2);border-radius:20px;padding:18px 34px 22px}
.maru-card svg{width:190px;height:190px}
.maru-card .t{font-family:"Klee One",serif;font-size:26px;font-weight:600;color:var(--red)}
.next{margin-top:6px;height:52px;padding:0 30px;border-radius:14px;background:var(--red);color:#fff;font-size:19px;font-weight:700}

/* result */
#result{align-items:center;justify-content:center;padding:24px}
.res{width:min(520px,100%);background:var(--paper);border:1px solid var(--line2);border-radius:18px;padding:30px;text-align:center}
.res h2{margin:0 0 6px;font-family:"Klee One",serif;font-size:30px}
.res .score{font-family:"Klee One",serif;font-size:56px;color:var(--red);margin:8px 0}
.res .row{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.btn{height:52px;padding:0 24px;border-radius:14px;font-size:18px;font-weight:700;border:1.5px solid var(--line2);background:#fff}
.btn.pri{background:var(--green);color:#fff;border-color:var(--green)}

@media (max-width:900px), (orientation:portrait){
  .main{flex-direction:column}
  .pad{width:auto;border-left:none;border-top:1px solid var(--line2);display:grid;grid-template-columns:1fr 1fr;align-items:start;max-height:46vh}
  .pad .keys{grid-row:span 4}
  .steps{display:none}
}
</style>
</head>
<body>

<section id="cover" class="screen show">
  <div class="notebook">
    <div class="label">
      <h1>まなびノート</h1>
      <p class="sub">かいて、こたえて、はなまるを あつめよう</p>
    </div>
    <p class="ask">がくねんを えらんでね</p>
    <div class="grades" id="grades"></div>
  </div>
</section>

<section id="toc" class="screen">
  <div class="page">
    <div class="pagehead">
      <button class="back" onclick="go('cover')">‹ ひょうし</button>
      <h2>もくじ</h2>
      <span class="chip" id="tocGrade">4年生</span>
    </div>
    <div id="units"></div>
  </div>
</section>

<section id="work" class="screen">
  <div class="bar">
    <button class="back" onclick="openToc()">‹ もくじ</button>
    <div class="title" id="wTitle"></div>
    <div class="dots" id="dots"></div>
  </div>
  <div class="main">
    <div class="paper" id="paper">
      <svg id="fig"></svg>
      <canvas id="cv"></canvas>
      <div class="qtext" id="qtext"></div>
      <div class="tools" id="tools">
        <button class="tool on" data-tool="pen" data-color="#2F2B27" aria-label="えんぴつ"><span class="sw" style="background:#2F2B27"></span></button>
        <button class="tool" data-tool="pen" data-color="#2B6CB0" aria-label="青ペン"><span class="sw" style="background:#2B6CB0"></span></button>
        <button class="tool" data-tool="pen" data-color="#D8352A" aria-label="赤ペン"><span class="sw" style="background:#D8352A"></span></button>
        <span class="sep"></span>
        <button class="tool" data-tool="eraser" aria-label="けしゴム"><svg viewBox="0 0 24 24" fill="none" stroke="#5F574D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 20H8.5l-4.2-4.3a1 1 0 0 1 0-1.4l9.8-9.8a1 1 0 0 1 1.4 0l5 5a1 1 0 0 1 0 1.4L13 20"/><path d="M8 11l6 6"/></svg></button>
        <button class="tool" id="undo" aria-label="ひとつもどす"><svg viewBox="0 0 24 24" fill="none" stroke="#5F574D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
        <button class="tool" id="clearAll" aria-label="ぜんぶけす"><svg viewBox="0 0 24 24" fill="none" stroke="#5F574D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>
      </div>
      <div id="maru">
        <div class="maru-card">
          <svg viewBox="-100 -100 200 200"><path id="maruPath" fill="none" stroke="#D8352A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div class="t" id="maruText">よくできました！</div>
          <button class="next" id="nextBtn">つぎへ</button>
        </div>
      </div>
    </div>
    <aside class="pad">
      <h3>こたえ</h3>
      <div class="answer" id="answer"></div>
      <div class="keys" id="keys"></div>
      <button class="check" id="checkBtn">こたえあわせ</button>
      <button class="hintbtn" id="hintBtn">ヒントを見る</button>
      <div id="hintBox"></div>
      <div class="msg" id="msg"></div>
      <div class="steps" id="steps"><b>ひっ算の じゅんばん</b><br>① たてる　② かける<br>③ ひく　　④ おろす</div>
    </aside>
  </div>
</section>

<section id="result" class="screen">
  <div class="res">
    <h2>おつかれさま！</h2>
    <div>はなまるの かず</div>
    <div class="score" id="score"></div>
    <div id="resMsg" style="font-size:17px;color:var(--sub)"></div>
    <div class="row">
      <button class="btn" onclick="openToc()">もくじへ</button>
      <button class="btn pri" onclick="startUnit(state.unit)">もういちど</button>
    </div>
  </div>
</section>

<script>
var CELL = 40;
var SET_SIZE = 5;
var STORE = 'manabi-note-v1';

function load(){ try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch(e){ return {}; } }
function save(){ try { localStorage.setItem(STORE, JSON.stringify(saved)); } catch(e){} }
var saved = load();
if (!saved.best) saved.best = {};

function rnd(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }

/* ---------- 問題の自動生成 ---------- */
var UNITS = {
  div1: {
    name: 'わり算の筆算（÷1けた・わりきれる）', kind: 'div',
    gen: function(){
      var d = rnd(2,9), q, a;
      do { q = rnd(12, Math.floor(999/d)); a = d*q; } while (a < 40);
      return { a:a, b:d, q:q, r:0, rem:false };
    }
  },
  div1r: {
    name: 'わり算の筆算（÷1けた・あまりあり）', kind: 'div',
    gen: function(){
      var d = rnd(3,9), q = rnd(12, Math.floor((999-d)/d)), m = rnd(1,d-1);
      return { a:d*q+m, b:d, q:q, r:m, rem:true };
    }
  },
  div2: {
    name: 'わり算の筆算（÷2けた）', kind: 'div',
    gen: function(){
      var d = rnd(12,49), q = rnd(2, Math.min(20, Math.floor((999-d)/d)));
      var m = Math.random() < 0.5 ? 0 : rnd(1,d-1);
      return { a:d*q+m, b:d, q:q, r:m, rem:true };
    }
  },
  rect: {
    name: '長方形・正方形の面積', kind: 'area',
    gen: function(){
      if (Math.random() < 0.3) { var s = rnd(2,6); return { shape:'sq', w:s, h:s, v:s*s }; }
      var w, h; do { w = rnd(3,9); h = rnd(2,6); } while (w === h);
      return { shape:'rect', w:w, h:h, v:w*h };
    }
  },
  lshape: {
    name: 'いろいろな形の面積', kind: 'area',
    gen: function(){
      var W = rnd(5,9), H = rnd(4,6), cw = rnd(1,W-3), ch = rnd(1,H-2);
      return { shape:'L', W:W, H:H, cw:cw, ch:ch, v:W*H-cw*ch };
    }
  }
};

var TOC = [
  { subject:'さんすう', color:'#2F8F6B', units:['div1','div1r','div2','rect','lshape'] },
  { subject:'こくご', color:'#B5651D', soon:['4年生の かん字'] },
  { subject:'えいご', color:'#2B6CB0', soon:['アルファベット', 'たんご'] }
];

/* ---------- 画面切りかえ ---------- */
var state = { grade: saved.grade || 4, unit:null, list:[], idx:0, results:[], tries:0, field:0, vals:['',''] };

function go(id){
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.toggle('show', s.id === id); });
  if (id === 'work') requestAnimationFrame(resizeCanvas);
}

function renderGrades(){
  var box = document.getElementById('grades'); box.innerHTML = '';
  for (var g=1; g<=6; g++){
    (function(g){
      var b = document.createElement('button');
      b.className = 'grade' + (g === 4 ? ' ready' : '');
      b.innerHTML = g + '年<small>' + (g === 4 ? 'はじめる' : 'じゅんびちゅう') + '</small>';
      if (g !== 4) b.disabled = true;
      b.onclick = function(){ state.grade = g; saved.grade = g; save(); openToc(); };
      box.appendChild(b);
    })(g);
  }
}

function openToc(){
  document.getElementById('tocGrade').textContent = state.grade + '年生';
  var box = document.getElementById('units'); box.innerHTML = '';
  var no = 1;
  TOC.forEach(function(sec){
    var h = document.createElement('div'); h.className = 'subject';
    h.innerHTML = '<span class="dot" style="background:'+sec.color+'"></span>' + sec.subject;
    box.appendChild(h);
    (sec.units || []).forEach(function(key){
      var b = document.createElement('button'); b.className = 'unit';
      var best = saved.best[key];
      b.innerHTML = '<span>' + UNITS[key].name + '</span><span class="lead"></span>' +
        (best != null ? '<span class="done">はなまる ' + best + '/' + SET_SIZE + '</span>' : '') +
        '<span class="no">p.' + (no++) + '</span>';
      b.onclick = function(){ startUnit(key); };
      box.appendChild(b);
    });
    (sec.soon || []).forEach(function(name){
      var b = document.createElement('div'); b.className = 'unit soon';
      b.innerHTML = '<span>' + name + '</span><span class="lead"></span><span class="no">じゅんびちゅう</span>';
      box.appendChild(b);
    });
  });
  go('toc');
}

/* ---------- 問題ページ ---------- */
function startUnit(key){
  state.unit = key; state.idx = 0; state.results = []; state.list = [];
  var seen = {};
  while (state.list.length < SET_SIZE){
    var p = UNITS[key].gen(), sig = JSON.stringify(p);
    if (!seen[sig]) { seen[sig] = 1; state.list.push(p); }
  }
  document.getElementById('wTitle').textContent = UNITS[key].name;
  document.getElementById('steps').style.display = UNITS[key].kind === 'div' ? '' : 'none';
  go('work');
  showProblem();
}

function cur(){ return state.list[state.idx]; }

function showProblem(){
  var p = cur(), kind = UNITS[state.unit].kind;
  state.tries = 0; state.vals = ['','']; state.field = 0; state.hints = 0;
  document.getElementById('hintBox').innerHTML = ''; updateHintBtn();
  strokes = []; redraw();
  document.getElementById('msg').textContent = ''; document.getElementById('msg').className = 'msg';
  document.getElementById('maru').classList.remove('show');
  renderDots();
  var q = document.getElementById('qtext');
  if (kind === 'div'){
    q.innerHTML = p.a + ' ÷ ' + p.b + ' を ひっ算で 計算しましょう。' +
      '<span class="hint">' + (p.rem ? 'わりきれない ときは あまりも 書こう' : 'こたえは わりきれるよ') + '</span>';
    drawDivision(p);
  } else {
    if (p.shape === 'sq') q.innerHTML = '1辺が ' + p.w + 'cm の 正方形の 面積は 何cm²ですか。';
    else if (p.shape === 'rect') q.innerHTML = 'たて ' + p.h + 'cm、よこ ' + p.w + 'cm の 長方形の 面積は 何cm²ですか。';
    else q.innerHTML = '下の 形の 面積は 何cm²ですか。';
    q.innerHTML += '<span class="hint">方眼の 1マスは 1cm として 考えよう</span>';
    drawArea(p);
  }
  renderAnswer();
}

function renderDots(){
  var box = document.getElementById('dots'); box.innerHTML = '';
  for (var i=0; i<SET_SIZE; i++){
    var d = document.createElement('i');
    if (i < state.results.length) d.className = state.results[i] ? 'ok' : 'ng';
    else if (i === state.idx) d.className = 'now';
    box.appendChild(d);
  }
}

/* ---------- 図をかく ---------- */
var NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, text){
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}
function cellText(svg, col, row, ch){
  svg.appendChild(el('text', { x: col*CELL + CELL/2, y: row*CELL + CELL/2 + 11, 'text-anchor':'middle',
    'font-size':30, 'font-family':'Klee One, serif', fill:'#2F2B27' }, ch));
}
function drawDivision(p){
  var svg = document.getElementById('fig'); svg.innerHTML = '';
  var ds = String(p.b), vs = String(p.a), r0 = 3, c0 = 2;
  for (var i=0; i<ds.length; i++) cellText(svg, c0+i, r0, ds[i]);
  var cd = c0 + ds.length;
  for (var j=0; j<vs.length; j++) cellText(svg, cd+j, r0, vs[j]);
  var x = cd*CELL, y = r0*CELL;
  svg.appendChild(el('path', { d:'M'+(x-4)+','+(y+CELL)+' Q'+(x+8)+','+(y+CELL/2)+' '+(x)+','+y+' L'+((cd+vs.length)*CELL+10)+','+y,
    fill:'none', stroke:'#2F2B27', 'stroke-width':2.5, 'stroke-linecap':'round' }));
  svg.appendChild(el('text', { x:(cd+vs.length)*CELL + 18, y:(r0-1)*CELL + 26, 'font-size':13, fill:'#A99D8C', 'font-family':'Zen Maru Gothic' }, '← しょうは ここに 書こう'));
}
function label(svg, x, y, t, anchor){
  svg.appendChild(el('text', { x:x, y:y, 'text-anchor':anchor||'middle', 'font-size':22, 'font-family':'Klee One, serif', fill:'#993C1D' }, t));
}
function drawArea(p){
  var svg = document.getElementById('fig'); svg.innerHTML = '';
  var ox = 2*CELL, oy = 4*CELL, style = { fill:'rgba(216,90,48,0.13)', stroke:'#993C1D', 'stroke-width':3, 'stroke-linejoin':'round' };
  if (p.shape === 'L'){
    var W=p.W, H=p.H, cw=p.cw, ch=p.ch, C=CELL;
    var pts = [[0,0],[W-cw,0],[W-cw,ch],[W,ch],[W,H],[0,H]].map(function(q){ return (ox+q[0]*C)+','+(oy+q[1]*C); }).join(' ');
    style.points = pts; svg.appendChild(el('polygon', style));
    label(svg, ox+(W-cw)*C/2, oy-10, (W-cw)+'cm');
    label(svg, ox+W*C+10, oy+(ch+H)*C/2+8, (H-ch)+'cm', 'start');
    label(svg, ox+W*C/2, oy+H*C+30, W+'cm');
    label(svg, ox-10, oy+H*C/2+8, H+'cm', 'end');
  } else {
    style.x = ox; style.y = oy; style.width = p.w*CELL; style.height = p.h*CELL;
    svg.appendChild(el('rect', style));
    label(svg, ox+p.w*CELL/2, oy+p.h*CELL+30, p.w+'cm');
    label(svg, ox-10, oy+p.h*CELL/2+8, p.h+'cm', 'end');
  }
}

/* ---------- こたえ入力 ---------- */
function renderAnswer(){
  var p = cur(), kind = UNITS[state.unit].kind, box = document.getElementById('answer');
  box.innerHTML = '';
  function field(i, cls){
    var f = document.createElement('div'); f.className = 'field' + (cls ? ' '+cls : '') + (state.field === i ? ' on' : '');
    f.textContent = state.vals[i];
    f.onclick = function(){ state.field = i; renderAnswer(); };
    box.appendChild(f);
  }
  function word(t){ var s = document.createElement('span'); s.textContent = t; box.appendChild(s); }
  if (kind === 'div'){ field(0); if (p.rem){ word('あまり'); field(1, 'small'); } }
  else { field(0); word('cm²'); }
}

function buildKeys(){
  var keys = ['7','8','9','4','5','6','1','2','3','けす','0','←'];
  var box = document.getElementById('keys');
  keys.forEach(function(k){
    var b = document.createElement('button'); b.className = 'key' + (k.length > 1 || k === '←' ? ' fn' : ''); b.textContent = k;
    b.onclick = function(){
      var v = state.vals[state.field];
      if (k === 'けす') v = '';
      else if (k === '←') v = v.slice(0,-1);
      else if (v.length < 4) v = (v === '0' ? '' : v) + k;
      state.vals[state.field] = v; renderAnswer();
    };
    box.appendChild(b);
  });
}

function check(){
  var p = cur(), kind = UNITS[state.unit].kind, msg = document.getElementById('msg');
  if (state.vals[0] === ''){ msg.className = 'msg ng'; msg.textContent = 'こたえを 入れてね'; return; }
  var ok;
  if (kind === 'div'){
    var r = state.vals[1] === '' ? 0 : +state.vals[1];
    ok = (+state.vals[0] === p.q) && (r === p.r);
  } else ok = (+state.vals[0] === p.v);
  state.tries++;
  if (ok){
    if (state.results.length === state.idx) state.results.push(state.tries === 1);
    showMaru(state.tries === 1 ? 'よくできました！' : 'できたね！');
  } else {
    msg.className = 'msg ng';
    msg.innerHTML = 'おしい！ もういちど 見なおしてみよう。';
    if (state.hints < 2){
      msg.innerHTML += '<br>こまったら ヒントを 見てね。';
      var hb = document.getElementById('hintBtn');
      hb.classList.remove('nudge'); void hb.offsetWidth; hb.classList.add('nudge');
    } else if (state.tries >= 2){
      var b = document.createElement('button'); b.textContent = 'こたえを 見る';
      b.onclick = function(){
        msg.className = 'msg';
        msg.textContent = 'こたえは ' + answerText(p) + ' だよ。';
        if (state.results.length === state.idx) state.results.push(false);
        var n = document.createElement('button'); n.textContent = 'つぎの もんだいへ'; n.onclick = nextProblem;
        msg.appendChild(document.createElement('br')); msg.appendChild(n);
        renderDots();
      };
      msg.appendChild(document.createElement('br')); msg.appendChild(b);
    }
  }
}
/* ---------- ヒント（2だんかい） ---------- */
function hintsFor(p){
  var kind = UNITS[state.unit].kind;
  if (kind === 'div'){
    var vs = String(p.a), k = 1;
    while (k < vs.length && +vs.slice(0,k) < p.b) k++;
    var head = vs.slice(0,k), h1;
    if (k === 1) h1 = 'まず いちばん上の 位の ' + head + ' ÷ ' + p.b + ' を 考えよう。';
    else h1 = vs.slice(0,k-1) + ' は ' + p.b + ' より 小さいから、上から ' + k + 'けたの ' + head + ' ÷ ' + p.b + ' から 考えよう。';
    if (p.b >= 10) h1 += '<br>' + p.b + ' を ' + (Math.round(p.b/10)*10) + ' くらいと 見て、見当を つけよう。';
    var qs = String(p.q);
    var h2 = '商は ' + qs.length + 'けたに なるよ。いちばん上の 数は ' + qs[0] + ' だよ。';
    if (p.rem) h2 += '<br>あまりは かならず ' + p.b + ' より 小さく なるよ。';
    return [h1, h2];
  }
  if (p.shape === 'sq') return ['正方形の 面積 ＝ 1辺 × 1辺', p.w + ' × ' + p.w + ' を 計算しよう。'];
  if (p.shape === 'rect') return ['長方形の 面積 ＝ たて × よこ', p.h + ' × ' + p.w + ' を 計算しよう。'];
  return ['大きな 長方形から、かけている 部分を ひいてみよう。（2つの 長方形に 分けても いいよ）',
          '図の 点線を 見てね。<br>' + p.H + ' × ' + p.W + ' から ' + p.ch + ' × ' + p.cw + ' を ひこう。'];
}
function updateHintBtn(){
  var b = document.getElementById('hintBtn');
  b.classList.toggle('done', state.hints >= 2);
  b.textContent = state.hints >= 2 ? 'ヒントは ここまで' : 'ヒント ' + (state.hints+1) + ' を見る';
}
function showHint(){
  if (state.hints >= 2) return;
  var p = cur(), h = hintsFor(p)[state.hints];
  state.hints++;
  var d = document.createElement('div'); d.className = 'hintcard';
  d.innerHTML = '<b>ヒント ' + state.hints + '</b>' + h;
  document.getElementById('hintBox').appendChild(d);
  if (p.shape === 'L' && state.hints === 2){
    var svg = document.getElementById('fig'), ox = 2*CELL, oy = 4*CELL;
    svg.appendChild(el('rect', { x: ox+(p.W-p.cw)*CELL, y: oy, width: p.cw*CELL, height: p.ch*CELL,
      fill:'rgba(224,180,76,0.18)', stroke:'#C9921E', 'stroke-width':2.5, 'stroke-dasharray':'7 6' }));
  }
  updateHintBtn();
}
function answerText(p){
  if (UNITS[state.unit].kind === 'div') return p.q + (p.r ? ' あまり ' + p.r : '');
  return p.v + 'cm²';
}

/* ---------- はなまる ---------- */
function maruPath(){
  var d = '', i, t, a, r;
  for (i=0; i<=110; i++){ t = i/110; a = t*2.6*2*Math.PI - Math.PI/2; r = 4 + t*46;
    d += (i ? 'L' : 'M') + (r*Math.cos(a)).toFixed(1) + ',' + (r*Math.sin(a)).toFixed(1); }
  for (i=0; i<=260; i++){ t = i/260; a = t*2*Math.PI*1.03 + 0.3; r = 66 + 13*Math.abs(Math.sin(a*4));
    d += 'L' + (r*Math.cos(a)).toFixed(1) + ',' + (r*Math.sin(a)).toFixed(1); }
  return d;
}
function showMaru(text){
  renderDots();
  document.getElementById('maruText').textContent = text;
  var ov = document.getElementById('maru'); ov.classList.add('show');
  var path = document.getElementById('maruPath');
  path.setAttribute('d', maruPath());
  var len = path.getTotalLength();
  path.style.transition = 'none'; path.style.strokeDasharray = len; path.style.strokeDashoffset = len;
  path.getBoundingClientRect();
  path.style.transition = 'stroke-dashoffset 1.1s ease-out'; path.style.strokeDashoffset = 0;
}
function nextProblem(){
  state.idx++;
  if (state.idx >= SET_SIZE){ finish(); return; }
  showProblem();
}
function finish(){
  var n = state.results.filter(Boolean).length;
  var prev = saved.best[state.unit];
  if (prev == null || n > prev){ saved.best[state.unit] = n; save(); }
  document.getElementById('score').textContent = n + ' / ' + SET_SIZE;
  document.getElementById('resMsg').textContent =
    n === SET_SIZE ? 'ぜんぶ はなまる！ すごい！' : n >= 3 ? 'いい ちょうし！ もう少しで ぜんぶ はなまる' : 'つぎは もっと はなまるを ふやそう';
  go('result');
}

/* ---------- 手書き（キャンバス） ---------- */
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var strokes = [], active = null, curStroke = null, penSeen = false;
var tool = { tool:'pen', color:'#2F2B27' };

function resizeCanvas(){
  var r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if (!r.width) return;
  cv.width = Math.round(r.width*dpr); cv.height = Math.round(r.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  redraw();
}
if (window.ResizeObserver) new ResizeObserver(resizeCanvas).observe(document.getElementById('paper'));
window.addEventListener('resize', resizeCanvas);

function widthOf(s, p){ return s.tool === 'eraser' ? 28 : (s.pen ? 2.2 + p*3.2 : 3.6); }
function seg(s, a, b){
  ctx.globalCompositeOperation = s.tool === 'eraser' ? 'destination-out' : 'source-over';
  ctx.strokeStyle = s.color; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = widthOf(s, (a.p + b.p)/2);
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
}
function dot(s, a){
  ctx.globalCompositeOperation = s.tool === 'eraser' ? 'destination-out' : 'source-over';
  ctx.fillStyle = s.color; ctx.beginPath(); ctx.arc(a.x, a.y, widthOf(s, a.p)/2, 0, Math.PI*2); ctx.fill();
}
function redraw(){
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); ctx.restore();
  strokes.forEach(function(s){
    if (s.pts.length === 1) dot(s, s.pts[0]);
    for (var i=1; i<s.pts.length; i++) seg(s, s.pts[i-1], s.pts[i]);
  });
  ctx.globalCompositeOperation = 'source-over';
}
function pt(e){
  var r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top, p: e.pointerType === 'pen' ? (e.pressure || 0.5) : 0.5 };
}
cv.addEventListener('pointerdown', function(e){
  if (e.pointerType === 'pen') penSeen = true;
  if (penSeen && e.pointerType === 'touch') return;
  if (active !== null) return;
  e.preventDefault();
  active = e.pointerId;
  try { cv.setPointerCapture(e.pointerId); } catch(err){}
  curStroke = { tool: tool.tool, color: tool.color, pen: e.pointerType === 'pen', pts: [pt(e)] };
  strokes.push(curStroke); dot(curStroke, curStroke.pts[0]);
});
cv.addEventListener('pointermove', function(e){
  if (e.pointerId !== active || !curStroke) return;
  e.preventDefault();
  var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  if (!evs.length) evs = [e];
  evs.forEach(function(ev){
    var a = curStroke.pts[curStroke.pts.length-1], b = pt(ev);
    curStroke.pts.push(b); seg(curStroke, a, b);
  });
  ctx.globalCompositeOperation = 'source-over';
});
function endStroke(e){ if (e.pointerId === active){ active = null; curStroke = null; } }
cv.addEventListener('pointerup', endStroke);
cv.addEventListener('pointercancel', endStroke);
document.addEventListener('touchmove', function(e){ if (e.target === cv) e.preventDefault(); }, { passive:false });

document.querySelectorAll('#tools .tool[data-tool]').forEach(function(b){
  b.onclick = function(){
    document.querySelectorAll('#tools .tool[data-tool]').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    tool = { tool: b.dataset.tool, color: b.dataset.color || '#000' };
  };
});
document.getElementById('undo').onclick = function(){ strokes.pop(); redraw(); };
document.getElementById('clearAll').onclick = function(){ strokes = []; redraw(); };
document.getElementById('checkBtn').onclick = check;
document.getElementById('hintBtn').onclick = showHint;
document.getElementById('nextBtn').onclick = nextProblem;

renderGrades();
buildKeys();
</script>
</body>
